services:
  # ── Frontend Expo Web (SPA statique) ─────────────────────────────────────
  - type: web
    name: certis-web
    runtime: static
    buildCommand: npm run build:web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false # URL publique de certis-api (ex. https://certis-api.onrender.com), lue au build
    routes:
      # Render ne réécrit que les chemins sans fichier : /_expo/... reste servi tel quel.
      - type: rewrite
        source: /*
        destination: /index.html

  # ── API NestJS ───────────────────────────────────────────────────────────
  # Node : version lue dans .nvmrc. PORT : fourni par Render.
  - type: web
    name: certis-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci && npx prisma generate && npm run build
    # Pas de preDeployCommand sur l'offre gratuite : migrations au démarrage (idempotentes).
    startCommand: cd backend && npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # chaîne de connexion Postgres (Neon, voir docs/adr/0008)
      - key: JWT_SECRET
        generateValue: true # 256 bits aléatoires générés par Render
      - key: ECDSA_PRIVATE_KEY
        sync: false # sortie de `node backend/scripts/generate-secrets.mjs`
