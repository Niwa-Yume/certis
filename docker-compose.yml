services:
  postgres:
    image: postgres:16
    container_name: certis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: certis
      POSTGRES_PASSWORD: certis_password
      POSTGRES_DB: certis_db
    ports:
      - "5432:5432"
    healthcheck: # `docker compose up --wait` attend que Postgres accepte les connexions
      test: ["CMD-SHELL", "pg_isready -U certis -d certis_db"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - certis_pgdata:/var/lib/postgresql/data

volumes:
  certis_pgdata: